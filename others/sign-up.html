<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Pitchside</title>
    <link rel="stylesheet" href="userstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="sign-up">
        
        <a href="../index.html" class="logo">Pitch<span>side</span></a>
        <div class="form-card">
        <div class="switch">
            <a href="sign-up.html" class="on">Fan</a>
            <a href="organiser-sign-up.html">Organizer</a>
</div>
<h2>Create your account</h2>
<p class="form-sub">Follow tournaments and get your own home page. It takes less than a minute.</p>
<form>
    <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. Jane Doe">
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password">
        <small>At least 8 characters</small>
    </div>
    <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <input type="Confirm password" id="confirm-password" placeholder="Repeat your password">
        </div>
    <label class="check">
    </label><input type="checkbox">
    <span>I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a></span>
</label>
<button type="submit" class="btn-main">Create account</button>
</form>
<p class="swap">Already have an account? <a href="log-in.html" class="link">Log in</a></p>
</div>
</main>
</body>
</html>
