<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Log In</title>
</head>
      <link rel="stylesheet" href="organiserstyle.css">
      <link href="https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<body>
    <main class="log-in">
      <a href="../index.html" class="logo">Pitch<span>side</span></a>
      <div class="first-div">  
        <div class="switch">
          <a href="log-in.html">Fan</a>
          <a href="organiser-log-in.html" class="on">Organizer</a>
       </div>
       <h2>Organizer log in</h2>
       <p>Manage your tournaments, teams and result.</p>
       <form>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
          </div>
          <div class="row-between">
            <label><input type="checkbox">Remember me</label>
            <a href="#" class="link">Forgot password?</a>
          </div>
          <button type="submit" class="submit-btn">Log in as organizer</button>
        </form>
        <p class="last-line">Want to run a tournament? <a href="organiser-sign-up.html" class="link">Register as an organiser</a></p>
      </div> 
    </main>
</body>
</html>
