<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log-in</title>
    <link rel="stylesheet" href="userstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="log-in">
        <a href="../index.html" class="logo">Pitch<span>side</span></a>

        <div class="form-card">
            <div class="switch">
                <a href="login.html" class="on">Fan</a>
                <a href="Organiser-log-in.html">Organizer</a>
            </div>

            <h2>Log in</h2>
            <p>Welcome back. Enter your details to continue. </p>

            <form>
                <div class="field">
                    <label for="Email">Email</label>
                    <input type="Email" id="Email" placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <div class="row-between">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" class="link">Forget password?</a>
                </div>
                <button type="submit" class="btn-main">Log in</button>
            </form>

            <p class="swap">New to Pitchside? <a href="sign-up.html" class="link">Sign up</a></p>
        </div>
    </main>
</body>
</html>
