<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Sign Up</title>
</head>
    <link rel="stylesheet" href="organiserstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=plus+jakarta+sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<body>
    <main class="sign-up">
        <a href="../index.html" class="logo">Pitch<span>side</span></a>
        <div class="second-div">
           <div class="switch">
            <a href="log-in.html">Fan</a>
            <a href="organiser-log-in.html" class="on">Organizer</a>
           </div>
           <h2>Register as an organizer</h2>
           <p>Create an account to start runningg tournaments.</p>
              <form>
                  <div class="field">
                 <label for="name">Full name</label>
                 <input type="text" id="name" placeholder="e.g. Jane Doe">
                  </div>
                  <div class="field">
                 <label for="email">Email</label>
                 <input type="email" id="email" placeholder="you@example.com">
                  </div>
                  <div class="field">
                  </div>
                   <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password">
                    <small>At least 8 characters</small>
                   </div>
                   <diV class="field">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password">
                   </diV>
                   <label class="check"><input type="checkbox">I agree to the <a href="#" class="link">Terms</a>and<a href="#" class="link">Privacy Policy</a></label>
                   <button type="submit" class="submit-btn">Create organizer account</button>
              </form>
                   <p class="swap">Already registered?<a href="organiser-log-in.html" class="link">Log in</a></p>
        </div>
    </main>
</body>
</html>
